name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go mod tidy -diff
      - run: make lint test build
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.1
      - run: make chart
      - run: helm template scoped charts/healthchecks-kubernetes --namespace monitoring --set config.cluster=ci --set config.namespace=jobs --set credentials.existingSecret=healthchecks > /dev/null
      - run: docker build -t healthchecks-kubernetes:test .
