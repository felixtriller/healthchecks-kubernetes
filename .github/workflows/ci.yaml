name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go mod tidy -diff
      - run: make lint test build
      - name: Check third-party licenses are current
        run: make licenses && git diff --exit-code THIRD_PARTY_LICENSES
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.1
      - run: make chart
      - run: helm template scoped charts/healthchecks-kubernetes --namespace monitoring --set config.cluster=ci --set config.namespace=jobs --set credentials.existingSecret=healthchecks > /dev/null
      - run: docker build --build-arg VERSION=ci -t healthchecks-kubernetes:test .
      - run: test "$(docker run --rm healthchecks-kubernetes:test --version)" = ci
      - run: docker run --rm --entrypoint /bin/sh healthchecks-kubernetes:test -c 'test -s /usr/share/licenses/healthchecks-kubernetes/LICENSE && test -s /usr/share/licenses/healthchecks-kubernetes/THIRD_PARTY_LICENSES'

  image:
    name: Publish container image
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/felixtriller/healthchecks-kubernetes
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
